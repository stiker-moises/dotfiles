# INPUT FIELD
input-field {
	monitor =
	size = 300, 60
	outline_thickness = 4
	dots_size = 0.2
	dots_spacing = 0.2
	dots_center = true
	outer_color = $accent
	inner_color = $bg
	font_color = $text
	fade_on_empty = false
	placeholder_text = <i>󰌾 Logged in as $USER</i>
	hide_input = false
	check_color = $accent
	fail_color = $red
	fail_text = <i>$FAIL: <b>$ATTEMPTS</b></i>
	capslock_color = $yellow
	position = 0, -47
	halign = center
	valign = center
}

label {
	monitor =
	text = cmd[update:1000]  echo -e "$(upower -i $(upower -e | rg -i bat) | rg 'state|percentage' | awk -F': ' 'BEGIN{icon="";} /state/{gsub(/^[ \t]+|[ \t]+$/, "", $2); state=$2;} /percentage/{gsub(/^[ \t]+|[ \t]+%$/, "", $2); percentage=$2; if(state=="charging"){icon="󰂄"} else {if(percentage >= 95 || percentage == 100) icon="󰁹"; else if (percentage >= 80) icon="󰂂"; else if(percentage >= 60) icon="󰂀"; else if(percentage >= 40) icon="󰁾"; else if(percentage >= 20) icon="󰁼"; else icon="󰁺";} print icon" "percentage"";}')"
	color = $text
	font_size = 25
	font_family = $font
	position = -30, -200
	halign = right
	valign = top
}
