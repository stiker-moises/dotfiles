source	= ~/.config/hypr/modules/vars

# Submaps
bind	= ALT, a, submap,onehand
bind	= ALT_SHIFT, 0, submap, "Gaming Mode - Press alt+shift+0 to exit"
submap	=onehand
bind	=,e, exec, $focusr
bind	=,a, exec, $focusl
bind	=,COMMA, exec, $focusu
bind	=,o, exec, $focusd
bind	=,e, alterzorder, top, active
bind	=,a, alterzorder, top, active
bind	=,COMMA, alterzorder, top, active
bind	=,o, alterzorder, top, active
bind	= ALT, e, movewindow, r
bind	= ALT, a, movewindow, l
bind	= ALT, COMMA, movewindow, u
bind	= ALT, o, movewindow, d
binde	= SUPER,e,resizeactive,10 0
binde	= SUPER,a,resizeactive,-10 0
binde	= SUPER,COMMA,resizeactive,0 -10
binde	= SUPER,o,resizeactive,0 10
bindel	=,XF86AudioRaiseVolume, exec, $volup
bindel	=,XF86AudioLowerVolume, exec, $voldown
bindl	= ALT, UP, exec, $volup
bindl	= ALT, DOWN, exec, $voldown
bindl	=,XF86AudioMute, exec, $volmute
bindl	=,XF86MonBrightnessUp, exec, $lightup
bindl	=,XF86MonBrightnessDown, exec, $lightdown
bindl	=,XF86AudioPlay, exec, playerctl play
bindl	=,XF86AudioPause, exec, playerctl pause
bindl	=,XF86AudioNext, exec, playerctl next
bindl	=,XF86AudioPrev, exec, playerctl previous
bindm	= SUPER, mouse:272, movewindow
bindm	= SUPER, mouse:273, resizewindow
bind	= ALT, mouse_up, exec, $workspaceup
bind	= ALT, mouse_down, exec, $workspacedown
bind	= SUPER, mouse_up, exec, $workspacesendup
bind	= SUPER, mouse_down, exec, $workspacesenddown
bind	=,ESCAPE,submap,reset
bindnr	=,catchall,submap,reset
submap	=reset
submap	="Gaming Mode - Press alt+shift+0 to exit"
bind	= ALT_SHIFT, 0, submap, reset
bindel	=,XF86AudioRaiseVolume, exec, $volup
bindel	=,XF86AudioLowerVolume, exec, $voldown
bindl	=,XF86AudioMute, exec, $volmute
bindl	=,XF86AudioMicMute, exec, $mictoggle
bindel	=,XF86MonBrightnessUp, exec, $lightup
bindel	=,XF86MonBrightnessDown, exec, $lightdown
bindl	=,XF86AudioPlay, exec, playerctl play
bindl	=,XF86AudioPause, exec, playerctl pause
bindl	=,XF86AudioNext, exec, playerctl next
bindl	=,XF86AudioPrev, exec, playerctl previous
submap	=reset

# Brightness
bindel	= SUPER, UP, exec, $lightup
bindel	= SUPER, DOWN, exec, $lightdown

# Clipboard
bind	= SUPER, j, exec, $clipshow
bindr	= SUPER, i, exec, $cliptype

# Close hyprland
bindl	= SUPER_ALT, r, exit,

# Lock screen
bindr	= SUPER_ALT, l, exec, $lock

# Media
bindl	= SUPER_ALT, PERIOD, exec, playerctl play-pause

# Menus
bind	= SUPER, SPACE, exec, $launcher
bind	= SUPER, ESCAPE, exec, $power

# Notifications
bind	= ALT, e, exec, $notificationdismiss
bind	= ALT, PERIOD, exec, $notificationinvoke

# Programs
bind	= SUPER, U, exec, $term
bind	= SUPER, PERIOD, exec, $files
bind	= SUPER, a, exec, $notes
bind	= SUPER, y, exec, $browser
bind	= CONTROL_SHIFT, escape, exec, $taskmanager
bind	= SUPER, COMMA, exec, $passwordmanager
bind	= SUPER_ALT, t, exec, syncplay --no-gui
bind	= SUPER_ALT, e, exec, $speedread

# Screenshots
bind	= ALT, o, exec, $screenshotsel
bind	= SUPER_ALT, p, exec, $screenshotmon
bind	= SUPER_ALT, o, exec, $screenshottext

# Volume
bindel	= ALT, UP, exec, $volup
bindel	= ALT, DOWN, exec, $voldown
bindel	= ALT, y, exec, $volup
bindel	= ALT, i, exec, $voldown
bindl	= ALT, apostrophe, exec, $sinkswitch
bindl	= SUPER, o, exec, $mictoggle
bindl	= SUPER_ALT, u, exec, $volmute

# Window management
bind	= SUPER, e, killactive,
bind	= ALT, k, togglefloating,
bind	= SUPER, k, togglesplit,
bind	= SUPER_ALT, u, exec, pkill -SIGUSR1 waybar
bind	= ALT, u, fullscreen
bind	= SUPER_ALT, x, exec, hyprctl kill
bind	= ALT, s, exec, $focusr
bind	= ALT, h, exec, $focusl
bind	= ALT, t, exec, $focusu
bind	= ALT, n, exec, $focusd
bind	= SUPER, s, movewindow, r
bind	= SUPER, h, movewindow, l
bind	= SUPER, t, movewindow, u
bind	= SUPER, n, movewindow, d

# Workspace move window
bind	= SUPER, 1, movetoworkspacesilent, 1
bind	= SUPER, 2, movetoworkspacesilent, 2
bind	= SUPER, 3, movetoworkspacesilent, 3
bind	= SUPER, 4, movetoworkspacesilent, 4
bind	= SUPER, 5, movetoworkspacesilent, 5
bind	= SUPER, 6, movetoworkspacesilent, 6
bind	= SUPER, 7, movetoworkspacesilent, 7
bind	= SUPER, x, movetoworkspacesilent, 7
bind	= SUPER, 8, movetoworkspacesilent, 8
bind	= SUPER, 9, movetoworkspacesilent, 9
bind	= SUPER, q, movetoworkspacesilent, 9
bind	= SUPER, 0, movetoworkspacesilent, 10
bind	= SUPER, SEMICOLON, movetoworkspacesilent, 10
bind	= SUPER, p, movetoworkspacesilent, special:

# Workspace switch
bind	= ALT, 1, workspace, 1
bind	= ALT, 2, workspace, 2
bind	= ALT, 3, workspace, 3
bind	= ALT, 4, workspace, 4
bind	= ALT, 5, workspace, 5
bind	= ALT, 6, workspace, 6
bind	= ALT, 7, workspace, 7
bind	= ALT, x, workspace, 7
bind	= ALT, 8, workspace, 8
bind	= ALT, j, workspace, 8
bind	= ALT, 9, workspace, 9
bind	= ALT, q, workspace, 9
bind	= ALT, 0, workspace, 10
bind	= ALT, SEMICOLON, workspace, 10
bind	= ALT, p, togglespecialworkspace, 

# Workspace up and down
bind	= ALT, mouse_down, exec, $workspaceup
bind	= ALT, mouse_up, exec, $workspacedown
bind	= SUPER, mouse_up, exec, $workspacesendup
bind	= SUPER, mouse_down, exec, $workspacesenddown
bind	= SUPER, TAB, exec, $workspacesendup
bind	= SUPER_SHIFT, TAB, exec, $workspacesenddown
binde	= ALT, TAB, exec, $workspaceup
binde	= ALT_SHIFT, TAB, exec, $workspacedown

# Zoom
bind	= SUPER_SHIFT, mouse_down, exec, $zoomin
bindl	= SUPER_SHIFT, mouse_up, exec, $zoomout

# List of binds
bind	= SUPER, SLASH, exec, $bindslist
