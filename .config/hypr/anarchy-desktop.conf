#devices
device {
	name = logitech-usb-receiver
	sensitivity = -0.85
	accel_profile = flat
	repeat_delay = 225
	repeat_rate = 8
#	scroll_factor = 0.01
}
device {
	name = charachorder-charachorder-two-s3-mouse
	sensitivity = -0.8
	accel_profile = flat
	scroll_factor = 0.1
}

device {
	name = paris-commune-mouse
	tap_button_map = lmr
}
device {
	name = sony-interactive-entertainment-dualsense-wireless-controller-touchpad
	enabled=0
}
device {
	name = sony-interactive-entertainment-wireless-controller-touchpad
	enabled=0
}

# Monitors
monitorv2 {
	output = DP-1
	bitdepth = 10
	mode = highrr
	position = 1280x0
	scale = 1
}
monitorv2 {
	output = DP-2
	mode = preferred
	position = 3840x0
	scale = 1
}

monitorv2 {
	output = HDMI-A-1
	bitdepth = 10
	disabled = 1
	mode = 2560x1440@120
	position = 0x0
	scale = 2
}
env = WAYLANDDRV_PRIMARY_MONITOR,DP-1
exec = xrandr --output DP-1 --primary
