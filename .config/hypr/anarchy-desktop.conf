# Startup apps
exec-once = while ! hyprctl dispatch focusmonitor DP-1 >/dev/null; do sleep 0.01; done
exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; equibop --start-minimized > /dev/null
exec-once = pidof librewolf > /dev/null || librewolf > /dev/null
exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; pidof qbittorrent > /dev/null || qbittorrent --no-splash > /dev/null
exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; pidof steam > /dev/null || steam-run steam -nochatui -nofriendsui -silent > /dev/null
exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; pidof nheko > /dev/null || nheko > /dev/null
exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; pidof Telegram > /dev/null || Telegram -startintray > /dev/null
# Startup other
#exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; element-desktop --hidden > /dev/null
#exec-once = swaymsg input "117:256:Paris_Commune_Mouse" map_to_output HDMI-A-1

exec-once = c=0; while ! wpctl set-profile $(pw-dump | jaq -r '.[]|select(.type=="PipeWire:Interface:Device" and .info.props["device.product.name"]=="Sound Blaster X4")|.id') 6 > /dev/null && [ $((c++)) -lt 5 ]; do sleep 0.2; done; [ $c -le 5 ] && wpctl set-default $(pw-cli i alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_X4.iec958-stereo | rg -oP 'id: \K\w+') > /dev/null
exec-once = c=0; while ! wpctl set-profile $(pw-dump | jaq -r '.[]|select(.type=="PipeWire:Interface:Device" and .info.props["device.product.name"]=="Blue Snowball")|.id') 2 > /dev/null && [ $((c++)) -lt 5 ]; do sleep 0.2; done; [ $c -le 5 ] && wpctl set-default $(pw-cli i alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_201507-00.mono-fallback | rg -oP 'id: \K\w+') > /dev/null
exec-once = swayidle timeout 660 "wpctl set-profile $(pw-dump | jaq -r '.[] | select(.type=="PipeWire:Interface:Device" and .info.props["device.product.name"]=="Sound Blaster X4") | .id') 6 > /dev/null && wpctl set-default $(pw-cli i alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_X4.iec958-stereo | rg -oP 'id: \K\w+') > /dev/null & hyprctl dispatch closewindow class:at\.yrlf\.wl_mirror > /dev/null & makoctl mode -r camera-shy & hyprctl dispatch closewindow class:mpvsounds > /dev/null & hyprctl dispatch closewindow class:spotify > /dev/null"
#variables
$send = hyprctl dispatch movewindow mon:HDMI-A-1 > /dev/null & makoctl mode -r camera-shy > /dev/null ; hyprctl dispatch closewindow class:at\.yrlf\.wl_mirror > /dev/null ; hyprctl dispatch movecursor 640 360 > /dev/null & swaymsg input "117:256:Paris_Commune_Mouse" map_to_output HDMI-A-1 > /dev/null
$away = hyprctl dispatch movetoworkspacesilent 1 > /dev/null
$totv = makoctl mode -r camera-shy > /dev/null & hyprctl dispatch closewindow class:at\.yrlf\.wl_mirror > /dev/null & hyprctl dispatch movecursor 640 360 > /dev/null & swaymsg input "117:256:Paris_Commune_Mouse" map_to_output HDMI-A-1 > /dev/null
$tomain = hyprctl dispatch closewindow class:at\.yrlf\.wl_mirror > /dev/null ; makoctl mode -a camera-shy > /dev/null ; hyprctl dispatch workspace 9 ; hyprctl dispatch movecursor 2580 720 > /dev/null ; swaymsg input "117:256:Paris_Commune_Mouse" map_to_output DP-1 > /dev/null ; wl-mirror -b screencopy-shm DP-1 > /dev/null && makoctl mode -r camera-shy > /dev/null && swaymsg input "117:256:Paris_Commune_Mouse" map_to_output HDMI-A-1 > /dev/null
$tosecondary = hyprctl dispatch closewindow class:at\.yrlf\.wl_mirror > /dev/null & makoctl mode -r camera-shy > /dev/null ; hyprctl dispatch workspace 9 ; hyprctl dispatch movecursor 4800 540 > /dev/null & swaymsg input "117:256:Paris_Commune_Mouse" map_to_output DP-2 > /dev/null &  wl-mirror -b screencopy-shm DP-2 > /dev/null && swaymsg input "117:256:Paris_Commune_Mouse" map_to_output HDMI-A-1 > /dev/null
$disabletv = ~/.config/scripts/smartthings devices:commands 1526283b-2f10-4f44-8eb1-d7226b49ece7 switch:off > /dev/null & hyprctl keyword monitorv2[HDMI-A-1]:disabled 1 > /dev/null & wpctl set-profile $(pw-dump | jaq -r '.[]|select(.type=="PipeWire:Interface:Device" and .info.props["device.product.name"]=="Sound Blaster X4")|.id') 6 > /dev/null && wpctl set-default $(pw-cli i alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_X4.iec958-stereo | rg -oP 'id: \K\w+') > /dev/null && notify-send --urgency=low --icon=/usr/share/icons/Flat-Remix-Red-Dark/panel/audio-volume-high-symbolic.svg "$(wpctl inspect @DEFAULT_AUDIO_SINK@ | rg --pcre2 -o '(?<=node.description = ").*(?=")')" -h string:x-canonical-private-synchronous:sink-state > /dev/null & hyprctl dispatch closewindow class:at\.yrlf\.wl_mirror > /dev/null & makoctl mode -r camera-shy > /dev/null & hyprctl dispatch closewindow class:mpvsounds > /dev/null & hyprctl dispatch closewindow class:spotify > /dev/null
$enabletv = hyprctl keyword monitorv2[HDMI-A-1]:disabled 0 > /dev/null ; wpctl set-profile $(pw-dump | jaq -r '.[]|select(.type=="PipeWire:Interface:Device" and .info.props["device.product.name"]=="Navi 21/23 HDMI/DP Audio Controller")|.id') 1 > /dev/null && wpctl set-default $(pw-cli i alsa_output.pci-0000_06_00.hdmi-stereo | rg -oP 'id: \K\w+') > /dev/null && notify-send --urgency=low --icon=/usr/share/icons/Flat-Remix-Red-Dark/panel/audio-volume-high-symbolic.svg "$(wpctl inspect @DEFAULT_AUDIO_SINK@ | rg --pcre2 -o '(?<=node.description = ").*(?=")')" -h string:x-canonical-private-synchronous:sink-state > /dev/null & hyprctl dispatch closewindow class:mpvsounds > /dev/null & swaymsg input '117:256:Paris_Commune_Mouse' map_to_output 'HDMI-A-1' > /dev/null & ~/.config/scripts/smartthings devices:commands 1526283b-2f10-4f44-8eb1-d7226b49ece7 switch:on > /dev/null || notify-send --urgency=low "TV is offline" > /dev/null && sleep 2 && "hyprctl keyword monitorv2[HDMI-A-1]:disabled 0" > /dev/null
$startnoise = hyprctl dispatch closewindow class:mpvsounds > /dev/null & hyprctl dispatch closewindow class:spotify > /dev/null & env PIPEWIRE_NODE=alsa_output.pci-0000_06_00.hdmi-stereo mpv --wayland-app-id=mpvsounds --start=0 --loop --pause=no --background=color --background-color=0/0/0/.03 --player-operation-mode=pseudo-gui ~/Documents/fire.opus > /dev/null
$startmusic = [workspace 9 silent] hyprctl dispatch closewindow class:mpvsounds > /dev/null & hyprctl keyword monitorv2[HDMI-A-1]:disabled 0 > /dev/null ; swaymsg input '117:256:Paris_Commune_Mouse' map_to_output 'HDMI-A-1' > /dev/null & env PULSE_SINK=alsa_output.pci-0000_06_00.hdmi-stereo spotify > /dev/null

##binds
bind = SUPER, l, exec, ~/.config/scripts/lights.sh

#work
#bind = SUPER_SHIFT, a, exec, $startwork

#look/desktop
bindl = SUPER, f, exec, $tomain
bindl = SUPER, d, exec, $totv
bindl = SUPER, p, exec, $tosecondary
bindl = SUPER, h, exec, $send
bindl = SUPER, a, exec, $away

#monitor
bindl = SUPER_SHIFT, t, exec, $disabletv
bindl = SUPER_SHIFT, RETURN, exec, $enabletv
#noise
bindl = ALT, r, exec, hyprctl dispatch closewindow class:mpvsounds
bind = SUPER_SHIFT, n, exec, $startmusic
bind = SUPER, n, exec, $startnoise

windowrule = workspace 9 silent, class:(at\.yrlf\.wl_mirror)
windowrule = fullscreen, class:(at\.yrlf\.wl_mirror)
workspace=1,monitor:DP-1,default:true
workspace=2,monitor:DP-2,default:true
workspace=3,monitor:DP-1
workspace=4,monitor:DP-2
workspace=5,monitor:DP-1
workspace=9,monitor:HDMI-A-1,default:true
workspace=10,monitor:HDMI-A-1
workspace=m[DP-1] n[s:special:],gapsin:20,gapsout:40 80 20 80
workspace=m[DP-2] n[s:special:],gapsin:20,gapsout:20 80 10 80
workspace=m[HDMI-A-1] n[s:special:],gapsin:10,gapsout:10 20 8 20
#windowrule = tile,class:(Wfica),title:(Office 365 Desktop)
windowrule = workspace 3 silent,class:(chrome-eafkcfmjahamkcccoaiancpfpphaflnj-Default)
windowrule = workspace 3 silent,class:(chrome-hkleablohhooipcdnigfpmlgpkjakgkk-Default)
windowrule = workspace 9 silent,class:(mpvsounds)
windowrule = bordersize 0, onworkspace:s[0],floating:0,class:(mpvsounds)
windowrule = workspace 9 silent,class:(dev\.alextren\.Spot)
windowrule = workspace 9 silent,class:(Spotify)
windowrule = workspace 9 silent,class:(at\.yrlf\.wl_mirror)
windowrule = idleinhibit always,class:(firefox)
windowrule = idleinhibit visible,class:(at\.yrlf\.wl_mirror)
windowrule = idleinhibit visible,class:(Wfica)


