bind=,switch:on:Lid Switch,exec, pidof hyprlock || ( pkill -15 tofi > /dev/null & hyprlock -c ~/.config/hypr/hyprlock/hyprlock-screenshot.conf > /dev/null || while ! hyprlock -c ~/.config/hypr/hyprlock/hyprlock-startup.conf > /dev/null; do sleep 0.01 > /dev/null; done > /dev/null )
bindl=,switch:on:Lid Switch,exec,systemctl sleep > /dev/null &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE > /dev/null &
exec-once = hyprctl dispatch exec wayland-pipewire-idle-inhibit > /dev/null &
exec-once = mkdir /tmp/Pictures/ && mv ~/Pictures/.clipboard/* /tmp/Pictures/
exec-once = pidof walker > /dev/null || while ! walker --gapplication-service > /dev/null; do sleep 0.01 > /dev/null; done
exec-once = pidof sunsetr > /dev/null || while true; do (sunsetr > /dev/null); done
exec-once = pidof hyprland-autoname-workspaces > /dev/null || while true; do (hyprland-autoname-workspaces > /dev/null); done
exec-once = pidof mako > /dev/null || while true; do (mako -c ~/.config/mako/config > /dev/null); done
exec-once = pidof swayosd-server > /dev/null || while ! swayosd-server -s ~/.config/swayosd/style.css > /dev/null; do sleep 0.01 > /dev/null; done
exec-once = pidof swww-daemon > /dev/null || while true ; do (swww-daemon -q --format xrgb > /dev/null); done
exec-once = pidof waybar > /dev/null || while true ; do (waybar > /dev/null); done
exec-once = pidof wljoywake > /dev/null || while ! wljoywake > /dev/null; do sleep 0.01 > /dev/null; done
exec-once = powerprofilesctl set performance && sleep 5 && rg -qq 0 /sys/class/power_supply/*/online && powerprofilesctl set power-saver || powerprofilesctl set performance
exec-once = swayidle timeout 600 'pidof hyprlock || ( pkill -15 tofi > /dev/null & hyprlock -c ~/.config/hypr/hyprlock/hyprlock-screenshot.conf --grace 59 > /dev/null || while ! hyprlock -c ~/.config/hypr/hyprlock/hyprlock-startup.conf > /dev/null; do sleep 0.01 > /dev/null; done > /dev/null )' timeout 660 'powerprofilesctl set power-saver & hyprctl dispatch dpms off' resume 'rg -qq 0 /sys/class/power_supply/*/online && powerprofilesctl set power-saver || powerprofilesctl set performance'
exec-once = systemctl start --user polkit-gnome-authentication-agent-1 > /dev/null &
exec-once = while ! hyprlock -c ~/.config/hypr/hyprlock/hyprlock-startup.conf > /dev/null; do sleep 0.01 > /dev/null; done > /dev/null
exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; zsh -c "${PASSWORDMANAGERBACKGROUND:-pidof bitwarden > /dev/null || while true ; do (bitwarden > /dev/null); done}"
exec-once = while ! pidof waybar > /dev/null; do sleep 0.2; done; pidof qtalarm > /dev/null || qtalarm --toggleOnDup > /dev/null &
exec-once = zsh -c "${CLIPBOARDMANAGERBACKGROUND:-pidof copyq > /dev/null || copyq --start-server > /dev/null}"
exec-once = while ! pidof wireplumber > /dev/null; do sleep 0.2; done; pidof easyeffects > /dev/null || while true; do (easyeffects --gapplication-service > /dev/null); done
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
