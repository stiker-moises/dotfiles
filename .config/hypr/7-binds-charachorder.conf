source = ~/.config/hypr/modules/vars

# Submaps
bind	= ALT, o, submap,onehand
bind	= SUPER_SHIFT, MINUS, submap, "Gaming Mode - Press super+shift+- to exit"
submap	= onehand
bind	=,k, exec, $focusr
bind	=,m, exec, $focusl
bind	=,v, exec, $focusu
bind	=,c, exec, $focusd
bind	= ALT, k, movewindow, r
bind	= ALT, m, movewindow, l
bind	= ALT, v, movewindow, u
bind	= ALT, c, movewindow, d
binde	= SUPER,k,resizeactive,10 0
binde	= SUPER,m,resizeactive,-10 0
binde	= SUPER,v,resizeactive,0 -10
binde	= SUPER,c,resizeactive,0 10
bindel	=,XF86AudioRaiseVolume, exec, $volup
bindel	=,XF86AudioLowerVolume, exec, $voldown
bindl	=,XF86AudioMute, exec, $volmute
bindl	=,XF86MonBrightnessUp, exec, $lightup
bindl	=,XF86MonBrightnessDown, exec, $lightdown
bindl	=,XF86AudioPlay, exec, playerctl play
bindl	=,XF86AudioPause, exec, playerctl pause
bindl	=,XF86AudioNext, exec, playerctl next
bindl	=,XF86AudioPrev, exec, playerctl previous
bindl	=,XF86AudioMicMute, exec, $mictoggle
bindm	= SUPER, mouse:272, movewindow
bindm	= SUPER, mouse:273, resizewindow
bind	= ALT, mouse_up, exec, $workspaceup
bind	= ALT, mouse_down, exec, $workspacedown
bind	= SUPER, mouse_up, exec, $workspacesendup
bind	= SUPER, mouse_down, exec, $workspacesenddown
bindl	=,ESCAPE,submap,reset
bindnr	=,CATCHALL,submap,reset
submap	= reset
submap	="Gaming Mode - Press super+shift+- to exit"
bind	= SUPER_SHIFT, MINUS, submap, reset
bindel	=,XF86AudioRaiseVolume, exec, $volup
bindel	=,XF86AudioLowerVolume, exec, $voldown
bindl	=,XF86AudioMute, exec, $volmute
bindel	=,XF86MonBrightnessUp, exec, $lightup
bindel	=,XF86MonBrightnessDown, exec, $lightdown
bindl	=,XF86AudioPlay, exec, playerctl play
bindl	=,XF86AudioPause, exec, playerctl pause
bindl	=,XF86AudioNext, exec, playerctl next
bindl	=,XF86AudioPrev, exec, playerctl previous
bindl	=,XF86AudioMicMute, exec, $mictoggle
submap	= reset

# Brightness
bindel	= ALT_SUPER, m, exec, $lightup
bindel	= ALT_SUPER, k, exec, $lightdown

# Clipboard
bind	= SUPER, k, exec, $clipshow
bindr	= ALT, k, exec, $cliptype

# Close hyprland
bindl	= ALT_SUPER, MINUS, exit,

# Lock screen
bindr	= SUPER_SHIFT, l, exec, $lock

# Media
bindl	= ALT, TAB, exec, playerctl play-pause

# Menus
bind	= SUPER, TAB, exec, $launcher
bind	= ALT_SUPER, e, exec, $power

# Notifications
bind	= SUPER, SPACE, exec, $notificationdismiss
bind	= SUPER, COMMA, exec, $notificationinvoke

# Programs
bind	= SUPER, r, exec, $term
bind	= SUPER_SHIFT, TAB, exec, $files
bind	= SUPER_SHIFT, r, exec, $notes
bind	= SUPER_SHIFT, e, exec, $browser
bind	= SUPER_SHIFT, k, exec, $passwordmanager
bind	= SUPER_SHIFT, v, exec, $taskmanager
bind	= ALT_SUPER, w, exec, $speedread

# Screenshots
bind	= SUPER_SHIFT, c, exec, $screenshotsel
bind	= ALT, e, exec, $screenshotmon
bind	= SUPER_SHIFT, m, exec, $screenshottext

# Volume
bindel	= SUPER_SHIFT, g, exec, $volup
bindel	= SUPER_SHIFT, w, exec, $voldown
bindl	= ALT, m, exec, $volmute
bindl	= ALT, r, exec, $sinkswitch
bindl	= SUPER, m, exec, $mictoggle

# Window management
bind	= SUPER, e, killactive,
bind	= SUPER_SHIFT, u, togglefloating,
bind	= ALT, i, togglesplit,
bind	= SUPER_SHIFT, z, exec, pkill -SIGUSR1 waybar
bind	= SUPER, u, fullscreen
bind	= ALT_SUPER, v, exec, hyprctl kill
bind	= ALT_SHIFT, PERIOD, exec, $focusr
bind	= ALT_SHIFT, COMMA, exec, $focusl
bind	= ALT_SHIFT, 1, exec, $focusu
bind	= ALT_SHIFT, 3, exec, $focusd
bind	= SUPER_SHIFT, PERIOD, movewindow, r
bind	= SUPER_SHIFT, COMMA, movewindow, l
bind	= SUPER_SHIFT, 1, movewindow, u
bind	= SUPER_SHIFT, 3, movewindow, d

# Workspace move window
bind	= SUPER, 1, movetoworkspacesilent, 1
bind	= ALT, v, movetoworkspacesilent, 1
bind	= SUPER, 2, movetoworkspacesilent, 2
bind	= ALT_SHIFT, SLASH, movetoworkspacesilent, 2
bind	= SUPER, 3, movetoworkspacesilent, 3
bind	= ALT, z, movetoworkspacesilent, 3
bind	= SUPER, 4, movetoworkspacesilent, 4
bind	= SUPER, 5, movetoworkspacesilent, 5
bind	= SUPER, 6, movetoworkspacesilent, 6
bind	= SUPER, 7, movetoworkspacesilent, 7
bind	= SUPER, 8, movetoworkspacesilent, 8
bind	= SUPER, 9, movetoworkspacesilent, 9
bind	= SUPER, 0, movetoworkspacesilent, 10
bind	= ALT, c, movetoworkspacesilent, special:

# Workspace switch
bind	= ALT, 1, workspace, 1
bind	= SUPER, v, workspace, 1
bind	= ALT, 2, workspace, 2
bind	= SUPER_SHIFT, SLASH, workspace, 2
bind	= ALT, 3, workspace, 3
bind	= SUPER, z, workspace, 3
bind	= ALT, 4, workspace, 4
bind	= ALT, 5, workspace, 5
bind	= ALT, 6, workspace, 6
bind	= ALT, 7, workspace, 7
bind	= ALT, 8, workspace, 8
bind	= ALT, 9, workspace, 9
bind	= ALT, 0, workspace, 10
bind	= SUPER, c, togglespecialworkspace, 

# Workspace up and down
bind	= SUPER, mouse_up, exec, $workspacedown
bind	= SUPER, mouse_down, exec, $workspaceup
bind	= ALT, mouse_up, exec, $workspacesenddown
bind	= ALT, mouse_down, exec, $workspacesendup
bind	= ALT, g, exec, $workspacesendup
bind	= ALT, w, exec, $workspacesenddown
binde	= SUPER, g, exec, $workspaceup
binde	= SUPER, w, exec, $workspacedown

# Zoom
bind	= SUPER_SHIFT, mouse_down, exec, $zoomin
bindl	= SUPER_SHIFT, mouse_up, exec, $zoomout

# List of binds
bind	= SUPER_SHIFT, h, exec, $bindslist

# Monitors
bind	= ALT_SHIFT, bracketright, focusmonitor, r
bind	= ALT_SHIFT, bracketleft, focusmonitor, l
bind	= ALT_SHIFT, 6, focusmonitor, u
bind	= ALT_SHIFT, 4, focusmonitor, d
