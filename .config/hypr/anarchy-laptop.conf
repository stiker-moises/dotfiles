#rm -rf ~/.wine/ && wineboot -u && cp -r ~/.local/share/LogMeIn\ Rescue\ Technician\ Console ~/.wine/drive_c/Program\ Files\ \(x86\)/LogMeIn\ Rescue\ Technician\ Console && wine ~/.wine/drive_c/Program\ Files\ \(x86\)/LogMeIn\ Rescue\ Technician\ Console/LogMeInRescueTechnicianConsole_x64/LMIRTechConsole.exe

device {
	name = logitech-usb-receiver
	sensitivity = -0.85
	accel_profile = flat
	repeat_delay = 225
	repeat_rate = 8
}
device {
	name = sony-interactive-entertainment-dualsense-wireless-controller-touchpad
	enabled=0
}
device {
	name = wacom-multitouch-sensor-finger
	enabled=0
}
device {
	name = sony-interactive-entertainment-wireless-controller-touchpad
	enabled=0
}

exec-once = discord --start-minimized
exec-once = floorp
exec-once = qbittorrent --no-splash
exec-once = steam -nochatui -nofriendsui -silent

monitor=eDP-1,highrr,auto,1.25
bind = SUPER, W, exec, ~/.config/tofi/scripts/lights.sh
#work
bind = SUPER_ALT, m, exec, wine ~/.wine/drive_c/Program\ Files\ \(x86\)/LogMeIn\ Rescue\ Technician\ Console/LogMeInRescueTechnicianConsole_x64/LMIRTechConsole.exe
bind = SUPER, COMMA, exec, floorp -private-window remote.imf.org & librewolf & teams-for-linux & wine ~/.wine/drive_c/Program\ Files\ \(x86\)/LogMeIn\ Rescue\ Technician\ Console/LogMeInRescueTechnicianConsole_x64/LMIRTechConsole.exe
bind = ALT, w, togglespecialworkspace, 
bind = ALT, q, hyprctl dispatch closewindow class:mpvsounds
bind = SUPER, o, hyprctl dispatch closewindow class:mpvsounds & hyprctl dispatch closewindow class:spotify
bind = SUPER, minus, hyprctl dispatch closewindow class:mpvsounds & hyprctl dispatch closewindow class:spotify & env PIPEWIRE_NODE=alsa_output.pci-0000_06_00.hdmi-stereo mpv --wayland-app-id=mpvsounds --start=0 --loop --pause=no --background=color --background-color=0/0/0/.03 --player-operation-mode=pseudo-gui ~/Documents/fire.ogg
bind = SUPER, apostrophe, exec, hyprctl dispatch closewindow class:mpvsounds & hyprctl dispatch closewindow class:spotify & env PIPEWIRE_NODE=alsa_output.pci-0000_06_00.hdmi-stereo mpv --wayland-app-id=mpvsounds --start=0 --loop --pause=no --background=color --background-color=0/0/0/.03 --player-operation-mode=pseudo-gui ~/Documents/fire.ogg

windowrule = tile,class:(lmirtechconsole\.exe)
windowrule = fullscreen,class:(at\.yrlf\.wl_mirror)

windowrule = workspace 3 silent,class:(Wfica)
windowrule = workspace 5 silent,class:(waydroid\.com\.citrix\.Receiver)
windowrule = workspace 3 silent,class:(Waydroid)
windowrule = workspace 9 silent,class:(mpvrainsounds)
windowrule = workspace special: silent,class:(chromium-browser)
windowrule = workspace special: silent,class:(librewolf)

windowrule = bordersize 0, onworkspace:r[1-10],class:(lmirtechconsole\.exe),title:(LogMeIn Rescue Technician Console)
windowrule = bordersize 0, onworkspace:r[1-10],class:(Wfica)
windowrule = bordersize 0, onworkspace:r[1-10],class:(Waydroid)
windowrule = bordersize 0, onworkspace:r[1-10],class:(waydroid\.com\.citrix\.Receiver)

windowrule = idleinhibit always,class:(chromium)
windowrule = idleinhibit always,class:(librewolf)
windowrule = idleinhibit visible,class:(at\.yrlf\.wl_mirror)
windowrule = idleinhibit visible,class:(Wfica)
windowrule = idleinhibit visible,class:(Waydroid)
windowrule = idleinhibit visible,class:(waydroid\.com\.citrix\.Receiver)

#	[class="lmirtechconsole.exe" window_type="dialog" title="Idle Time-Out"] kill
env = GDK_SCALE,1.25
env = STEAM_FORCE_DESKTOPUI_SCALING,1.25
#clipboard hack
bindntr=CTRL,C,exec,hyprctl activewindow | rg -q "class: Wfica" && ( sleep 0.025 && hyprctl closewindow class:alacrittyclipboard ; alacritty -qq --config-file ~/.config/alacritty/alacrittyclipboard.toml --class 'alacrittyclipboard' --title 'Office 365 Desktop (SSL/TLS Secured, 256 bit)' -e sh -c 'sleep 0.03 && xclip -o | copyq copy - ; copyq clipboard | xclip -i' ) & ( sleep 0.25 && closewindow class:alacrittyclipboard )
windowrule = float,class:(alacrittyclipboard)
windowrule = stayfocused,class:(alacrittyclipboard)
windowrule = noborder,class:(alacrittyclipboard)
windowrule = noanim,class:(alacrittyclipboard)
windowrule = noblur,class:(alacrittyclipboard)
windowrule = opacity 0,class:(alacrittyclipboard)
windowrule = maxsize 1 1,class:(alacrittyclipboard)

